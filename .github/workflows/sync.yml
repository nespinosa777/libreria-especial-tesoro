name: Sincronizar catálogo Especial Tesoro

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      test_limit:
        description: "Productos para prueba (0 = catálogo completo)"
        required: false
        default: "10"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Sincronizar catálogo
        env:
          SYNC_LIMIT: ${{ github.event.inputs.test_limit || '0' }}
        run: python sync_catalog.py

      - name: Guardar catálogo actualizado
        run: |
          git config user.name "Especial Tesoro Bot"
          git config user.email "actions@users.noreply.github.com"
          git add products.json
          git diff --cached --quiet || git commit -m "Actualizar catálogo y portadas"
          git push
